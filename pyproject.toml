[project]
name = "baby-onit"
version = "0.1.0"
description = "Tiny single-file agent harness distilled from onit — for teaching how an agent harness works."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rowel Atienza" }]
dependencies = [
  "openai>=1.40",
  "ollama>=0.4",
  "pyyaml>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "ddgs>=9.0",
  "rich>=13.0",
  "keyring>=24.0",
]

[project.scripts]
baby-onit = "baby_onit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["baby_onit.py"]
